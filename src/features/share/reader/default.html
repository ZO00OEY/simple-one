      if (stack.length) stack[stack.length - 1].body.append(section);
      else parent.insertBefore(section, heading);
      const body = document.createElement("div");
      body.className = "heading-body";
      const button = document.createElement("button");
      button.type = "button";
      button.className = "heading-toggle";
      button.dataset.heading = heading.textContent || "\u6807\u9898";
      const arrow = document.createElement("span");
      arrow.textContent = "\u25BE";
      arrow.setAttribute("aria-hidden", "true");
      button.append(arrow);
      button.setAttribute("aria-expanded", "true");
      button.setAttribute("aria-label", `\u6298\u53E0 ${button.dataset.heading}`);
      button.addEventListener("click", () => {
        body.hidden = !body.hidden;
        button.setAttribute("aria-expanded", String(!body.hidden));
        button.setAttribute("aria-label", `${body.hidden ? "\u5C55\u5F00" : "\u6298\u53E0"} ${button.dataset.heading}`);
        arrow.textContent = body.hidden ? "\u25B8" : "\u25BE";
      });
      heading.prepend(button);
      section.append(heading, body);
      stack.push({ level, body });
    }
  }
}
function enhanceDiagram(node) {
  if (!node.querySelector("svg") || node.closest(".simple-mermaid-frame")) return;
  const frame = document.createElement("section");
  frame.className = "simple-mermaid-frame";
  const toolbar = document.createElement("div");
  toolbar.className = "simple-mermaid-toolbar";
  const label = document.createElement("strong");
  label.textContent = "流程图";
  toolbar.append(label);
  const viewport = document.createElement("div");
  viewport.className = "simple-mermaid-viewport";
  let scale = 1;
  const resize = value => { scale = Math.max(.5, Math.min(4, value)); node.style.width = `${scale * 100}%`; };
  const button = (text, action) => {
    const control = document.createElement("button");
    control.type = "button"; control.textContent = text;
    control.addEventListener("click", action); toolbar.append(control); return control;
  };
  button("适应宽度", () => resize(1));
  button("缩小", () => resize(scale - .25));
  button("放大", () => resize(scale + .25));
  const fullscreen = button("全屏", () => {
    const open = frame.classList.toggle("is-fullscreen");
    fullscreen.textContent = open ? "退出全屏" : "全屏";
    fullscreen.setAttribute("aria-expanded", String(open));
    if (open) fullscreen.focus();
  });
  frame.addEventListener("keydown", event => {
    if (event.key === "Escape" && frame.classList.contains("is-fullscreen")) fullscreen.click();
  });
  node.before(frame); viewport.append(node); frame.append(toolbar, viewport);
}
function renderTags(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) {
    const node = walker.currentNode;
    if (!node.parentElement?.closest("a,pre,code,script,style,textarea,.katex,.mermaid,.share-tag")) nodes.push(node);
  }
  for (const node of nodes) {
    const text = node.textContent || "";
    const fragment = document.createDocumentFragment();
    let offset = 0;
    for (const match of text.matchAll(/(^|[\s（(，,；;：:])#([\p{L}\p{N}_-]+(?:\/[\p{L}\p{N}_-]+)*)/gu)) {
      // Numeric fragments such as #123 are not Obsidian tags.
      if (!/[\p{L}_-]/u.test(match[2])) continue;
      const start = match.index + match[1].length;
      fragment.append(document.createTextNode(text.slice(offset, start)));
      const tag = document.createElement("span");
      tag.className = "share-tag";
      tag.textContent = `#${match[2]}`;
      fragment.append(tag);
      offset = match.index + match[0].length;
    }
    if (offset) {
      fragment.append(document.createTextNode(text.slice(offset)));
      node.replaceWith(fragment);
    }
  }
}
function decorate(root) {
  renderTags(root);
  root.querySelectorAll("img[width][height]").forEach((image) => {
    const width = Number(image.getAttribute("width")), height = Number(image.getAttribute("height"));
    if (width > 0 && height > 0 && width <= 4096 && height <= 4096) image.style.aspectRatio = `${width} / ${height}`;
  });
  root.querySelectorAll("pre.share-html-source").forEach((source) => {
    const raw = source.textContent || "";
    const frame = document.createElement("iframe");
    frame.className = "share-html-preview";
    frame.title = "HTML \u9759\u6001\u9884\u89C8";
    frame.setAttribute("sandbox", "");
    frame.referrerPolicy = "no-referrer";
    const safe = DOMPurify.sanitize(raw, { WHOLE_DOCUMENT: true, ADD_TAGS: ["style"], FORBID_TAGS: ["script", "iframe", "object", "embed", "form", "link", "meta", "base"], FORBID_ATTR: ["srcdoc"] });
    const preview = new DOMParser().parseFromString(safe, "text/html");
    const policy = preview.createElement("meta");
    policy.httpEquiv = "Content-Security-Policy";
    policy.content = "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' https: data:; font-src 'none'; script-src 'none'; form-action 'none'; base-uri 'none'";
    preview.head.prepend(policy);
    const style = preview.createElement("style");
    style.textContent = 'body{font-family:"Microsoft YaHei",sans-serif;font-size:16px;line-height:1.8;margin:16px}img{max-width:100%;height:auto}';
    preview.head.prepend(style);
    frame.srcdoc = "<!doctype html>" + preview.documentElement.outerHTML;
    const details = document.createElement("details"), summary = document.createElement("summary");
    summary.textContent = "\u67E5\u770B HTML \u6E90\u7801";
    source.before(frame, details);
    details.append(summary, source);
  });
  root.querySelectorAll("think,thinking,think_nya\\~,snapshot,abstract,todo,seeds,events").forEach((node) => {
    const details = document.createElement("details");
    details.className = "share-special-block";
    const summary = document.createElement("summary");
    const labels = { think: "\u601D\u8003\u8FC7\u7A0B", thinking: "\u601D\u8003\u8FC7\u7A0B", "think_nya~": "\u601D\u8003\u8FC7\u7A0B", snapshot: "Snapshot", abstract: "\u6458\u8981", todo: "\u5F85\u529E", seeds: "Seeds", events: "\u4E8B\u4EF6" };
    summary.textContent = labels[node.tagName.toLowerCase()] || node.tagName;
    const body = document.createElement("div");
    body.append(...Array.from(node.childNodes));
    details.append(summary, body);
    node.replaceWith(details);
  });
  root.querySelectorAll("blockquote").forEach((block) => {
    const first = block.querySelector("p");
    const match = /^\[!([\w-]+)\]([+-]?)([^\n]*)\n?/.exec(first?.textContent || "");
    if (!first || !match) return;
    block.classList.add("callout");
    block.dataset.callout = match[1].toLowerCase();
    const heading = document.createElement("strong");
    heading.textContent = match[3].trim() || match[1];
    let remaining = match[0].length;
    const walker = document.createTreeWalker(first, NodeFilter.SHOW_TEXT);
    while (remaining > 0) {
      const node = walker.nextNode();
      if (!node) break;
      const value = node.textContent || "";
      node.textContent = value.slice(remaining);
      remaining -= value.length;
    }
    if (match[2]) {
      const details = document.createElement("details");
      details.open = match[2] !== "-";
      const summary = document.createElement("summary");
      summary.append(heading);
      details.append(summary);
      while (block.firstChild) details.append(block.firstChild);
      block.append(details);
    } else block.prepend(heading);
  });
  root.querySelectorAll("li > p, li").forEach((item) => {
    const node = item.firstChild;
    const match = /^\[([ xX])\]\s/.exec(node?.textContent || "");
    if (!node || node.nodeType !== Node.TEXT_NODE || !match) return;
    node.textContent = (node.textContent || "").slice(match[0].length);
    const check = document.createElement("input");
    check.type = "checkbox";
    check.disabled = true;
    check.checked = match[1] !== " ";
    item.prepend(check);
  });
  root.querySelectorAll("a").forEach((link) => {
    if (/^https?:/.test(link.getAttribute("href") || "")) {
      link.target = "_blank";
      link.rel = "noopener noreferrer";
    } else if (link.getAttribute("href")?.startsWith("#") && !link.getAttribute("href")?.startsWith("#/")) {
      link.addEventListener("click", (event) => {
        event.preventDefault();
        revealTarget(root.querySelector(`[id="${CSS.escape(decodeURIComponent(link.hash.slice(1)))}"]`));
      });
    }
  });
}
function renderList() {
  list.replaceChildren();
  const query = search.value.toLowerCase();
  const root = { folders: new Map(), notes: [] };
  catalog.filter((note) => `${note.title} ${note.category}`.toLowerCase().includes(query)).forEach((note) => {
    // Categories are public folder paths; never expose the private source path.
    const parts = (note.category || "").split(/[\\/]+/).filter(Boolean);
    let folder = root;
    for (const part of parts) {
      if (!folder.folders.has(part)) folder.folders.set(part, { folders: new Map(), notes: [] });
      folder = folder.folders.get(part);
    }
    folder.notes.push(note);
  });
  function appendFolder(parent, folder) {
    for (const [name, child] of folder.folders) {
      const details = document.createElement("details");
      details.open = true;
      const summary = document.createElement("summary");
      summary.textContent = name;
      const children = document.createElement("div");
      children.className = "folder-children";
      appendFolder(children, child);
      details.append(summary, children);
      parent.append(details);
    }
    for (const note of folder.notes) {
      const link = document.createElement("a");
      link.href = `#/notes/${note.id}`;
      link.textContent = note.title;
      parent.append(link);
    }
  }
  appendFolder(list, root);
}
async function route() {
  const current = ++request;
  const match = /^#\/notes\/([a-z0-9]{12})(?:\/(.*))?$/.exec(location.hash);
  content.replaceChildren();
  content.closest("main")?.classList.remove("has-columns");
  if (!match) {
    title.textContent = "\u5206\u4EAB\u7B14\u8BB0";
    content.textContent = `\u5171 ${catalog.length} \u7BC7\u7B14\u8BB0\uFF0C\u8BF7\u4ECE\u76EE\u5F55\u9009\u62E9\u3002`;
    return;
  }
  const note = catalog.find((item) => item.id === match[1]);
  title.textContent = note?.title || "\u7B14\u8BB0\u4E0D\u5B58\u5728\u6216\u5DF2\u5220\u9664";
  if (!note) return;
  content.textContent = "\u6B63\u5728\u8BFB\u53D6\u2026";
  try {
    const path = note.path || `notes/${note.id}.md`;
    if (!path.startsWith("notes/") || !path.endsWith(`/${note.id}.md`) || path.split("/").some(part => !part || part.startsWith(".") || /[\\\x00-\x1f]/.test(part))) throw new Error("Invalid note path");
    const response = await fetch(path.split("/").map(encodeURIComponent).join("/"), { cache: "no-cache" });
    if (!response.ok) throw new Error("\u7B14\u8BB0\u6587\u4EF6\u5C1A\u672A\u90E8\u7F72\u6216\u5DF2\u5220\u9664");
    const source = await response.text();
    if (current !== request) return;
    content.replaceChildren(DOMPurify.sanitize(md.render(source), { RETURN_DOM_FRAGMENT: true, ADD_TAGS: ["math", "annotation", "think", "thinking", "think_nya~", "snapshot", "abstract", "todo", "seeds", "events"], FORBID_TAGS: ["iframe", "object", "embed", "form", "style", "link", "meta"], FORBID_ATTR: ["srcdoc"] }));
    content.closest("main")?.classList.toggle("has-columns", Boolean(content.querySelector(".simple-columns")));
    decorate(content);
    foldHeadings(content);
    mermaid.initialize({ startOnLoad: false, securityLevel: "strict", theme: matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "default" });
    for (const node of Array.from(content.querySelectorAll(".mermaid"))) {
      try {
        await mermaid.run({ nodes: [node], suppressErrors: true });
        if (current === request) enhanceDiagram(node);
      } catch {
        node.classList.remove("mermaid");
      }
    }
    if (current === request && match[2]) revealTarget(content.querySelector(`[id="${CSS.escape(decodeURIComponent(match[2]))}"]`));
  } catch (error) {
    if (current === request) content.textContent = error instanceof Error ? error.message : "\u8BFB\u53D6\u5931\u8D25";
  }
}
search.addEventListener("input", renderList);
window.addEventListener("hashchange", () => {
  void route();
});
void fetch("catalog.json", { cache: "no-cache" }).then((response) => {
  if (!response.ok) throw new Error("\u76EE\u5F55\u5C1A\u672A\u90E8\u7F72");
  return response.json();
}).then((value) => {
  catalog = value.notes.filter((note) => /^[a-z0-9]{12}$/.test(note.id));
  renderList();
  return route();
}).catch(() => {
  title.textContent = "\u76EE\u5F55\u8BFB\u53D6\u5931\u8D25";
  content.textContent = "\u8BF7\u7A0D\u540E\u5237\u65B0\uFF0C\u6216\u68C0\u67E5\u7F51\u7AD9\u90E8\u7F72\u72B6\u6001\u3002";
});
</script>
